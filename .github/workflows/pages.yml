name: Deploy Web Demo to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # The lab is only published once the full suite has passed. Previously this
  # workflow inlined its own copy of the web tests and deployed independently,
  # so a commit that broke `go test` still shipped.
  unit-tests:
    name: Unit Tests
    uses: ./.github/workflows/test-unit.yml

  web:
    name: Web Lab
    uses: ./.github/workflows/test-web.yml

  deploy:
    needs: [unit-tests, web]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build web wasm assets
        run: ./web/build-wasm.sh

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
