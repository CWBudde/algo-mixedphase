name: Format Check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  format:
    name: treefmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Every formatter is pinned. This job fails the build on any diff, so an
      # unpinned `@latest` would let an upstream release break `main` with no
      # change to this repository.
      - name: Install Go formatters
        run: |
          go install mvdan.cc/gofumpt@v0.10.0
          go install github.com/daixiang0/gci@v0.14.0

      - name: Install shell tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.12.0

      - name: Install prettier
        run: npm install -g prettier@3.5.3

      - name: Install typstyle
        run: |
          curl -fsSL \
            https://github.com/typstyle-rs/typstyle/releases/download/v0.13.17/typstyle-x86_64-unknown-linux-musl \
            -o /usr/local/bin/typstyle
          chmod +x /usr/local/bin/typstyle

      - name: Run treefmt
        uses: isbecker/treefmt-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on-change: true
