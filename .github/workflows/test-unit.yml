name: Unit Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only one Go version is tested: algo-dsp and algo-fft both declare
      # `go 1.25.0`, so a "previous stable" job would silently download 1.25
      # through GOTOOLCHAIN and test nothing extra.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Just
        uses: extractions/setup-just@v2

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Coverage floor
        run: just check-coverage

      - name: Comparison reproducibility
        run: just compare-check

      - name: Module tidiness
        run: just check-tidy

      - name: Cross-build determinism
        run: ./scripts/test-cross-build.sh
