name: Paper

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build English paper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Typst
        uses: typst-community/setup-typst@v3
        with:
          typst-version: "0.15.0"

      - name: Install Just
        uses: extractions/setup-just@v2

      - name: Install typstyle
        run: |
          curl -fsSL \
            https://github.com/typstyle-rs/typstyle/releases/download/v0.13.17/typstyle-x86_64-unknown-linux-musl \
            -o /usr/local/bin/typstyle
          chmod +x /usr/local/bin/typstyle

      - name: Check paper formatting
        run: >-
          typstyle --check docs/paper/paper.typ docs/paper/paper_brief.typ
          docs/paper/style.typ docs/paper/charts.typ

      - name: Build paper
        run: just paper

      - name: Build brief
        run: just paper-brief

      - name: Upload papers
        uses: actions/upload-artifact@v4
        with:
          name: mixed-phase-filter-design-en
          path: |
            docs/paper/mixed-phase-filter-design-en.pdf
            docs/paper/mixed-phase-filter-design-brief-en.pdf
          if-no-files-found: error

  release:
    name: Attach paper to tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download CI-built paper
        uses: actions/download-artifact@v4
        with:
          name: mixed-phase-filter-design-en
          path: release

      - name: Create release and attach paper
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/mixed-phase-filter-design-en.pdf
            release/mixed-phase-filter-design-brief-en.pdf
          fail_on_unmatched_files: true
          generate_release_notes: true
